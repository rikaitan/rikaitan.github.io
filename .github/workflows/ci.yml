name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

# Finish the production deployment before another one starts.
concurrency:
  group: documentation-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Zensical
        run: pip install -r requirements.txt

      # Zensical recommends clean CI builds without a persistent build cache.
      - name: Build site
        run: zensical build --clean

      # Check critical output before publishing the site.
      - name: Validate build output
        shell: bash
        run: |
          test -s site/index.html
          test -s site/search.json
          test -s site/assets/images/social/index.png
          test ! -e site/CNAME
          cmp docs/javascripts/browser-detect.js site/javascripts/browser-detect.js
          cmp docs/rikaitan-pdf-viewer/web/index.html site/rikaitan-pdf-viewer/web/index.html
          cmp docs/rikaitan-pdf-viewer/build/pdf.worker.mjs site/rikaitan-pdf-viewer/build/pdf.worker.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-gh:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
